# Runs migrations once. A Job is immutable: to run it again, delete it first.
apiVersion: batch/v1
kind: Job
metadata:
  name: notes-api-migrate
  namespace: notes
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: notes-api-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
      containers:
        - name: migrate
          image: notes-api:local
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef:
                name: notes-api
            - secretRef:
                name: notes-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
